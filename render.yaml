# render.yaml

services:
  - type: web
    name: online-food-ordering-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    envVars:
      - key: APP_NAME
        value: "Online Food Ordering and Delivery"

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        generateValue: true

      - key: DB_CONNECTION
        value: pgsql

      - key: DB_HOST
        fromDatabase:
          name: online-food-ordering-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: online-food-ordering-db
          property: port

      - key: DB_DATABASE
        fromDatabase:
          name: online-food-ordering-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: online-food-ordering-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: online-food-ordering-db
          property: password

      - key: CACHE_STORE
        value: database

      - key: SESSION_DRIVER
        value: database

      - key: QUEUE_CONNECTION
        value: database

      - key: LOG_CHANNEL
        value: stderr

  - type: web
    name: online-food-ordering-frontend
    runtime: static
    plan: free
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: NODE_VERSION
        value: 22.18.0

      - key: VITE_API_HOST
        fromService:
          type: web
          name: online-food-ordering-api
          property: host

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: online-food-ordering-db
    plan: free
    databaseName: online_food_ordering_db
    user: online_food_ordering_user